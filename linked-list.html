<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linked List Visualizer — AlgoViz</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #0a0f1d; color: #f1f5f9; padding: 24px; }
    .top-bar { max-width: 1050px; margin: 0 auto 20px; display: flex; justify-content: space-between; align-items: center; }
    a.back { color: #38bdf8; text-decoration: none; font-weight: 600; }
    .tabs { max-width: 1050px; margin: 0 auto 20px; display: flex; flex-wrap: wrap; gap: 10px; }
    .tab-btn {
      background: #111827; color: #cbd5e1; border: 1px solid #334155;
      padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600;
    }
    .tab-btn.active { background: #38bdf8; color: #0a0f1d; border-color: #38bdf8; }
    .main { max-width: 1050px; margin: 0 auto; display: grid; grid-template-columns: 1.25fr 1fr; gap: 20px; }
    @media (max-width: 820px) { .main { grid-template-columns: 1fr; } }
    .panel { background: #111827; border: 1px solid #1e293b; border-radius: 12px; padding: 20px; }
    .list-area {
      min-height: 120px; margin: 20px 0; padding: 16px;
      background: #090d16; border-radius: 8px;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .node {
      display: flex; align-items: center; background: #1e293b; border: 1px solid #38bdf8;
      border-radius: 8px; overflow: hidden; transition: 0.25s;
    }
    .node.highlight { background: #f59e0b; color: #000; border-color: #f59e0b; }
    .node-val { padding: 10px 14px; font-weight: bold; border-right: 1px solid #334155; }
    .node-next { padding: 10px 10px; font-size: 11px; opacity: 0.85; }
    .arrow { color: #38bdf8; font-weight: bold; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    button.act, input.val {
      padding: 8px 14px; border-radius: 8px; border: 1px solid #334155;
      background: #1e293b; color: #fff; cursor: pointer;
    }
    input.val { width: 100px; cursor: text; }
    .code-line { font-family: monospace; font-size: 13px; padding: 5px 10px; border-radius: 5px; white-space: pre; }
    .code-line.active { background: rgba(56, 189, 248, 0.22); border-left: 3px solid #38bdf8; }
    .status { margin-top: 14px; padding: 12px; background: #090d16; border-radius: 8px; font-size: 14px; color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="index.html" class="back">← Back to Home</a>
    <h2 style="margin:0;">Singly Linked List Visualizer</h2>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="setLMode('insertHead', this)">Insert Head</button>
    <button class="tab-btn" onclick="setLMode('insertTail', this)">Insert Tail</button>
    <button class="tab-btn" onclick="setLMode('deleteVal', this)">Delete Value</button>
    <button class="tab-btn" onclick="setLMode('searchVal', this)">Search</button>
    <button class="tab-btn" onclick="setLMode('full', this)">Full in One</button>
  </div>

  <div class="main">
    <div class="panel">
      <div style="font-size:13px; color:#94a3b8;">HEAD → Nodes linked via <code>next</code> pointer → NULL</div>
      <div class="list-area" id="listArea"></div>
      <div class="controls" id="lControls"></div>
      <div class="status" id="lStatus">Choose an operation to see pointers update step-by-step.</div>
    </div>

    <div class="panel">
      <h3 style="margin-top:0;">Algorithm & Code</h3>
      <div id="lCode"></div>
    </div>
  </div>

  <script>
    const L_CODES = {
      insertHead: [
        "function insertAtHead(val) {",
        "  const node = new Node(val);",
        "  node.next = head;",
        "  head = node;",
        "}"
      ],
      insertTail: [
        "function insertAtTail(val) {",
        "  const node = new Node(val);",
        "  if (!head) { head = node; return; }",
        "  let curr = head;",
        "  while (curr.next) curr = curr.next;",
        "  curr.next = node;",
        "}"
      ],
      deleteVal: [
        "function deleteNode(val) {",
        "  if (!head) return;",
        "  if (head.val === val) { head = head.next; return; }",
        "  let curr = head;",
        "  while (curr.next && curr.next.val !== val) curr = curr.next;",
        "  if (curr.next) curr.next = curr.next.next;",
        "}"
      ],
      searchVal: [
        "function search(target) {",
        "  let curr = head, idx = 0;",
        "  while (curr) {",
        "    if (curr.val === target) return idx;",
        "    curr = curr.next; idx++;",
        "  }",
        "  return -1;",
        "}"
      ],
      full: [
        "// Interactive Singly Linked List",
        "insertAtHead(v) -> newNode.next = head; head = newNode;",
        "insertAtTail(v) -> traverse to last node; last.next = newNode;",
        "deleteNode(v)   -> unlink target node by updating prev.next;",
        "search(v)       -> step through nodes until match or NULL;"
      ]
    };

    let nodes = [12, 24, 36];
    let lMode = "insertHead";
    let lHi = -1;
    let lLine = -1;

    function renderList() {
      const area = document.getElementById("listArea");
      if (nodes.length === 0) {
        area.innerHTML = `<span style="color:#64748b;">HEAD → NULL (Empty List)</span>`;
      } else {
        area.innerHTML = `<span class="arrow">HEAD</span>` + nodes.map((v, i) => `
          <span class="arrow">→</span>
          <div class="node ${i === lHi ? "highlight" : ""}">
            <div class="node-val">${v}</div>
            <div class="node-next">${i === nodes.length - 1 ? "NULL" : "next"}</div>
          </div>
        `).join("") + `<span class="arrow">→ NULL</span>`;
      }

      document.getElementById("lCode").innerHTML = L_CODES[lMode].map((line, idx) =>
        `<div class="code-line ${idx === lLine ? "active" : ""}">${idx + 1}  ${line}</div>`
      ).join("");
    }

    function setLMode(mode, btn) {
      lMode = mode;
      lHi = -1;
      lLine = -1;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");

      const ctrl = document.getElementById("lControls");
      if (mode === "insertHead") {
        ctrl.innerHTML = `<input class="val" id="lVal" type="number" value="5" /><button class="act" onclick="runInsertHead()">Insert Head</button>`;
      } else if (mode === "insertTail") {
        ctrl.innerHTML = `<input class="val" id="lVal" type="number" value="50" /><button class="act" onclick="runInsertTail()">Insert Tail</button>`;
      } else if (mode === "deleteVal") {
        ctrl.innerHTML = `<input class="val" id="lVal" type="number" value="24" /><button class="act" onclick="runDeleteVal()">Delete</button>`;
      } else if (mode === "searchVal") {
        ctrl.innerHTML = `<input class="val" id="lVal" type="number" value="36" /><button class="act" onclick="runSearchVal()">Search</button>`;
      } else {
        ctrl.innerHTML = `
          <input class="val" id="lVal" type="number" value="99" />
          <button class="act" onclick="runInsertHead(true)">Insert Head</button>
          <button class="act" onclick="runInsertTail(true)">Insert Tail</button>
          <button class="act" onclick="runDeleteVal(true)">Delete</button>
          <button class="act" onclick="runSearchVal(true)">Search</button>
        `;
      }
      renderList();
    }

    function setLStatus(msg) { document.getElementById("lStatus").textContent = msg; }

    function runInsertHead(isFull = false) {
      const val = Number(document.getElementById("lVal")?.value || 5);
      lLine = isFull ? 1 : 2;
      setLStatus(`Creating node (${val}) and pointing node.next to current HEAD...`);
      renderList();
      setTimeout(() => {
        nodes.unshift(val);
        lHi = 0;
        lLine = isFull ? 1 : 3;
        setLStatus(`Updated HEAD to new node ${val}.`);
        renderList();
      }, 550);
    }

    function runInsertTail(isFull = false) {
      const val = Number(document.getElementById("lVal")?.value || 50);
      lLine = isFull ? 2 : 4;
      setLStatus(`Traversing to tail to attach ${val}...`);
      renderList();
      setTimeout(() => {
        nodes.push(val);
        lHi = nodes.length - 1;
        lLine = isFull ? 2 : 5;
        setLStatus(`Appended ${val} at the end of the linked list.`);
        renderList();
      }, 550);
    }

    function runDeleteVal(isFull = false) {
      const target = Number(document.getElementById("lVal")?.value);
      const idx = nodes.indexOf(target);
      lLine = isFull ? 3 : 4;
      if (idx === -1) {
        setLStatus(`Value ${target} not found in the list.`);
        renderList();
        return;
      }
      lHi = idx;
      setLStatus(`Found node ${target} at index ${idx}, unlinking it...`);
      renderList();
      setTimeout(() => {
        nodes.splice(idx, 1);
        lHi = -1;
        lLine = isFull ? 3 : 5;
        setLStatus(`Deleted ${target} and reconnected pointers.`);
        renderList();
      }, 600);
    }

    function runSearchVal(isFull = false) {
      const target = Number(document.getElementById("lVal")?.value);
      if (nodes.length === 0) { setLStatus("List is empty."); return; }
      let i = 0;
      lLine = isFull ? 4 : 2;
      const timer = setInterval(() => {
        if (i >= nodes.length) {
          clearInterval(timer);
          lHi = -1;
          setLStatus(`Search finished: ${target} not found.`);
          renderList();
          return;
        }
        lHi = i;
        setLStatus(`Checking node at index ${i} (value = ${nodes[i]})...`);
        renderList();
        if (nodes[i] === target) {
          clearInterval(timer);
          setLStatus(`Found ${target} at index ${i}!`);
        }
        i++;
      }, 500);
    }

    setLMode("insertHead", document.querySelector(".tab-btn"));
  </script>
</body>
</html>
